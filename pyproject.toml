[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revops"
version = "0.1.0"
description = "Multi-agent pipeline for revenue operations: CRM hygiene, transcript-based deal risk, weekly digest"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Prabhat Tyagi" }]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
live = ["anthropic>=0.40"]
data = ["faker>=24"]
dev = ["pytest>=8", "ruff>=0.4", "faker>=24"]

[project.scripts]
revops = "revops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
